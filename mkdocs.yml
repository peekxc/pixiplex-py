site_name: pixinet

site_author: Matt Piekenbrock

# Repository
repo_name: peekxc/pixiplex-py
repo_url: https://github.com/peekxc/pixiplex-py

nav: 
  - index.md
  - overview.md
  - workflows.md
  - renderers.md
  - Reference: 
    - PY API: $api/pixiplex.pixinet 
    - JS API:
      - Core (pixinet.js): api/pixinet.md
      - Renderers:
        - Index: api/renderers/index.md
        - Runtime: api/renderers/runtime.md
        - Individual: api/renderers/individual.md
        - Grouped: api/renderers/grouped.md
        - Mesh: api/renderers/mesh.md
        - WebGL: api/renderers/webgl.md
        - Types: api/renderers/types.md

theme:
  name: material
  features:
    - navigation.top
    - navigation.tracking
    - navigation.footer
    - navigation.indexes
    - navigation.instant
    - navigation.sections
    # - navigation.tabs
    # - navigation.tabs.sticky
    # - content.action.edit
    # - content.action.view
    - content.code.annotate
    - content.code.copy
    - content.tooltips
    - search.highlight
    - search.share
    - search.suggest
    - toc.follow

plugins:
  - mkapi
  - search
  # - minify:
  #     minify_html: true

markdown_extensions:
  - admonition
  - tables
  - footnotes
  - attr_list
  - md_in_html
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

extra_css:
  - css/sig-docs.css
  - css/mkapi.css

extra_javascript:
  - path: js/pixinet.mjs
    type: module
  - path: js/extra.js 
    type: module
