site_name: pixinet
# site_url: https://squidfunk.github.io/mkdocs-material/
site_author: Matt Piekenbrock

# Repository
repo_name: squidfunk/mkdocs-material
repo_url: https://github.com/squidfunk/mkdocs-material

nav: 
  - index.md
  - Reference: 
    - PY API: $api/pixiplex.pixinet 
    - JS API: api/pixinet.md

theme:
  name: material
  features:
    - navigation.top
    - navigation.tracking
    - navigation.footer
    - navigation.indexes
    - navigation.instant
    - navigation.sections
    # - navigation.tabs
    # - navigation.tabs.sticky
    # - content.action.edit
    # - content.action.view
    - content.code.annotate
    - content.code.copy
    - content.tooltips
    - search.highlight
    - search.share
    - search.suggest
    - toc.follow

plugins:
  - mkapi
  - search
  # - minify:
  #     minify_html: true

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - tables
  - footnotes
  - attr_list
  - md_in_html

extra_css:
  - css/sig-docs.css
  - css/mkapi.css
