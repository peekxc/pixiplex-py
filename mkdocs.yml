site_name: pixinet

site_author: Matt Piekenbrock

# Repository
repo_name: peekxc/pixiplex-py
repo_url: https://github.com/peekxc/pixiplex-py

nav: 
  - index.md
  - Overview: overview.md
  - Workflow: workflows.md
  - Renderers: renderers.md
  - Reference: 
    - PY API: $api/pixiplex.pixinet 
    - JS API:
      - pixinet.js: api/js/pixinet.md
      - widget.js: api/js/widget.md
      - core:
        - utils.js: api/js/core/utils.md
        - graph.js: api/js/core/graph.md
        - styles.js: api/js/core/styles.md
        - simulation.js: api/js/core/simulation.md
        - viewport.js: api/js/core/viewport.md
      - renderers:
        - runtime.js: api/js/renderers/runtime.md
        - individual.js: api/js/renderers/individual.md
        - grouped.js: api/js/renderers/grouped.md
        - mesh.js: api/js/renderers/mesh.md
        - webgl.js: api/js/renderers/webgl.md

theme:
  name: material
  features:
    - navigation.top
    - navigation.tracking
    - navigation.footer
    - navigation.indexes
    - navigation.instant
    - navigation.sections
    # - navigation.tabs
    # - navigation.tabs.sticky
    # - content.action.edit
    # - content.action.view
    - content.code.annotate
    - content.code.copy
    - content.tooltips
    - search.highlight
    - search.share
    - search.suggest
    - toc.follow

plugins:
  - mkapi
  - search
  # - minify:
  #     minify_html: true

markdown_extensions:
  - admonition
  - tables
  - footnotes
  - attr_list
  - md_in_html
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

extra_css:
  - css/sig-docs.css
  - css/mkapi.css

extra_javascript:
  - path: js/pixinet.mjs
    type: module
  - path: js/extra.js 
    type: module
